<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #4facfe;
        }

        button {
            padding: 12px 24px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #3a8fd9;
        }

        #weather-result {
            text-align: center;
            color: #555;
            font-size: 18px;
        }

        .weather-info {
            margin-top: 20px;
        }

        .weather-info h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .weather-info p {
            margin: 10px 0;
            font-size: 18px;
        }

        .temp {
            font-size: 48px;
            font-weight: bold;
            color: #4facfe;
        }

        .error {
            color: #ff4444;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name...">
            <button id="search-btn">Get Weather</button>
        </div>

        <div id="weather-result">
            <!-- Weather data will appear here -->
        </div>
    </div>

    <script>
        // Your JavaScript code will go here!
        console.log('Weather app loaded!');
    </script>
</body>
</html>
